image: hashicorp/terraform:1.12.2

variables:
  
  AWS_ACCESS_KEY_ID: $S3_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: $S3_SECRET_KEY

  TF_VAR_token: $YC_TOKEN
  TF_VAR_cloud_id: $YC_CLOUD_ID
  TF_VAR_folder_id: $YC_FOLDER_ID
  TF_VAR_default_zone: $YC_DEFAULT_ZONE

  TF_VAR_s3_access_key: $S3_ACCESS_KEY
  TF_VAR_s3_secret_key: $S3_SECRET_KEY

stages:
  - init
  - plan
  - apply
  - destroy

terraform_init:
  stage: init
  script:
    - terraform init
  artifacts:
    paths:
      - .terraform/
      - .terraform.lock.hcl

terraform_plan:
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan
  dependencies:
    - terraform_init

terraform_apply:
  stage: apply
  script:
    - terraform apply -auto-approve tfplan
  when: manual
  dependencies:
    - terraform_init
    - terraform_plan

terraform_destroy:
  stage: destroy
  script:
    - terraform destroy -auto-approve
  when: manual
